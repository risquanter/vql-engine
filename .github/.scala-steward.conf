# Scala Steward per-repository configuration.
# Reference: https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Create or refresh dependency-update PRs as soon as an update is available. The
# workflow's weekly schedule already bounds how often Scala Steward runs, so a
# per-dependency time throttle would only suppress re-opening a PR that was
# closed within the window.
pullRequests.frequency = "@asap"
