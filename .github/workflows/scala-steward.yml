name: Scala Steward

# Scala Steward opens one pull request per available update to an sbt library or
# plugin, the Scala version, or the sbt version. Dependabot
# (.github/dependabot.yml) covers GitHub Actions only and does not support sbt
# dependencies; this workflow fills that gap.

on:
  schedule:
    - cron: "0 6 * * 1"    # Mondays 06:00 UTC — weekly, matching Dependabot's cadence
  workflow_dispatch: {}     # allow a manual run

# The workflow's GITHUB_TOKEN needs no write access: STEWARD_PAT below carries the
# permission to push branches and open pull requests.
permissions:
  contents: read

# One run at a time; a scheduled run is never cancelled mid-flight.
concurrency:
  group: scala-steward
  cancel-in-progress: false

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      # ghaction-import-gpg configures git signing with git_user_signingkey, which
      # needs a git repository in the workspace; without this checkout it fails
      # with "fatal: not in a git directory". Scala Steward clones the target
      # repository itself, so this checkout exists only to give the import step a
      # git directory.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Import the dedicated commit-signing GPG key into the runner's keyring so
      # Scala Steward can sign every commit. main requires signed, verified
      # commits; GitHub marks these Verified because the key's public half and a
      # matching committer email are both registered on the account that owns
      # STEWARD_PAT.
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.STEWARD_GPG_PRIVATE_KEY }}
          passphrase:      ${{ secrets.STEWARD_GPG_PASSPHRASE }}
          git_user_signingkey: true

      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        with:
          # A fine-grained PAT scoped to this repository (Contents and Pull
          # requests write), not the default GITHUB_TOKEN: GitHub suppresses
          # workflow runs on PRs opened by GITHUB_TOKEN, so pr-build.yml would
          # not run and the bumps would merge untested. A PAT-opened PR triggers
          # it. Signing commits also requires a PAT rather than a GitHub App.
          github-token: ${{ secrets.STEWARD_PAT }}
          # Sign every commit with the imported key. author-email/author-name are
          # taken from that key so the committer identity matches the signature
          # GitHub verifies against.
          signing-key:  ${{ secrets.STEWARD_GPG_KEY_ID }}
          sign-commits: true
          author-email: ${{ steps.import_gpg.outputs.email }}
          author-name:  ${{ steps.import_gpg.outputs.name }}
