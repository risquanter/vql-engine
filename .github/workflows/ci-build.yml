name: CI Build + Sigstore provenance

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1

      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y jq gpg zip

      - name: Run tests (JVM + Scala.js) and stage Maven bundle
        run: |
          set -euo pipefail
          sbt -batch "+test; publish"

          # The Central Portal bundle must contain only version directories
          find target/bundle \( -name 'maven-metadata*' -o -name '*.module*' \) -delete

          echo "Staged bundle contents:"
          find target/bundle -type f | sort

      - name: Import encrypted GPG private-subkey into ephemeral GNUPGHOME
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # create ephemeral GNUPGHOME for isolation
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          # write the armored encrypted blob to a temp file (do not expose to logs)
          TMP_ENC="/tmp/private-key.asc.gpg"
          printf '%s' "$GPG_PRIVATE_KEY" > "$TMP_ENC"
          chmod 600 "$TMP_ENC"

          # decrypt the encrypted blob into a temporary plaintext file
          TMP_PLAINT="/tmp/private-key.asc"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --decrypt --output "$TMP_PLAINT" "$TMP_ENC"

          # import the plaintext secret key into the ephemeral GNUPGHOME
          gpg --batch --import "$TMP_PLAINT"
          gpgconf --kill gpg-agent || true

          # discover the signing keyid (first secret key)
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "Failed to determine GPG KEYID"
            shred -u "$TMP_PLAINT" || rm -f "$TMP_PLAINT"
            rm -f "$TMP_ENC"
            exit 1
          fi

          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "GPG_KEYID=$KEYID" >> $GITHUB_ENV

          # securely delete the plaintext file as soon as possible
          shred -u "$TMP_PLAINT" || rm -f "$TMP_PLAINT"
          rm -f "$TMP_ENC"

          echo "Imported encrypted GPG key into ephemeral GNUPGHOME and removed plaintext."

      - name: GPG-sign all bundle artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          find target/bundle -type f \( -name '*.jar' -o -name '*.pom' \) | while read -r f; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEYID" --armor --detach-sign "$f"
            echo "signed: $f"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts with Sigstore
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          find target/bundle -type f \( -name '*.jar' -o -name '*.pom' \) | while read -r f; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
            echo "sigstore-signed: $f"
          done

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/bundle/**/*.jar'

      - name: Ship provenance next to each main jar
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # The SLSA provenance attestation travels to Maven Central next to each
          # main jar so a consumer can verify it offline against our pinned
          # workflow identity (cosign verify-blob-attestation
          # --new-bundle-format --type slsaprovenance). One attestation bundle
          # covers every variant's jar; a copy sits next to each variant's main
          # jar and verification matches that jar's own digest inside it.
          if [ ! -f "$PROVENANCE_BUNDLE" ]; then
            echo "❌ Attestation bundle not found at $PROVENANCE_BUNDLE"
            exit 1
          fi
          find target/bundle -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | while read -r jar; do
            cp "$PROVENANCE_BUNDLE" "${jar}.intoto.jsonl"
            echo "provenance shipped: ${jar}.intoto.jsonl"
          done

      - name: Checksum and GPG-sign the provenance files
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The Central Portal validates every bundle file it does not treat as a
          # bare-tolerated companion. It tolerates .asc/.md5/.sha1/.sigstore.json
          # unchecksummed, but rejects .intoto.jsonl without md5, sha1, and a GPG
          # signature. Give each provenance file all three so the deployment
          # passes validation; the checksums and .asc are themselves tolerated bare.
          find target/bundle -type f -name '*.intoto.jsonl' | while read -r f; do
            md5sum "$f"  | awk '{print $1}' > "$f.md5"
            sha1sum "$f" | awk '{print $1}' > "$f.sha1"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEYID" --armor --detach-sign "$f"
            echo "provenance signed + checksummed: $f"
          done

      - name: Assert both platform variants are present
        run: |
          set -euo pipefail
          # A dropped platform variant is a valid upload to Maven Central (it just
          # ships fewer artifacts), so Central never catches it;
          # it is the one completeness failure nothing downstream detects. Assert
          # both variants exist, each with its pom, main jar, and shipped
          # provenance file. Sources/javadoc completeness stays Central's job.
          BUNDLE=target/bundle

          check_variant() {
            label="$1"; dir="$2"
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then
              echo "❌ Missing $label platform variant under $BUNDLE"
              exit 1
            fi
            pom=$(find "$dir" -maxdepth 1 -type f -name '*.pom' | head -1)
            mainjar=$(find "$dir" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
            prov=$(find "$dir" -maxdepth 1 -type f -name '*.intoto.jsonl' | head -1)
            [ -n "$pom" ]     || { echo "❌ $label variant missing its .pom"; exit 1; }
            [ -n "$mainjar" ] || { echo "❌ $label variant missing its main jar"; exit 1; }
            [ -n "$prov" ]    || { echo "❌ $label variant missing its provenance file"; exit 1; }
            echo "✅ $label variant complete: $dir"
          }

          # Version-leaf directory of each variant (the dir holding the .pom).
          jvm_dir=$(find "$BUNDLE" -type f -name '*.pom' -path '*_3/*' ! -path '*_sjs1_3/*' -printf '%h\n' | sort -u | head -1)
          js_dir=$(find "$BUNDLE" -type f -name '*.pom' -path '*_sjs1_3/*' -printf '%h\n' | sort -u | head -1)
          check_variant "JVM (_3)" "$jvm_dir"
          check_variant "Scala.js (_sjs1_3)" "$js_dir"

      - name: Create deployment bundle ZIP
        run: |
          set -euo pipefail
          cd target/bundle
          zip -r ../../maven-central-artifacts.zip com
          cd -
          unzip -l maven-central-artifacts.zip

      - name: Upload Maven deployment bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-${{ github.run_id }}
          path: maven-central-artifacts.zip
          retention-days: 7

      - name: Cleanup GPG
        if: always()
        run: |
          set +e  # Don't fail on cleanup errors
          if [ -n "${GNUPGHOME:-}" ] && [ -d "${GNUPGHOME}" ]; then
            rm -rf "${GNUPGHOME}"
          fi
          pkill -u "$(id -u)" gpg-agent 2>/dev/null || true
          rm -f maven-central-artifacts.zip 2>/dev/null
          echo "✅ Cleanup completed"
