###############################################################
# Pull-request test workflow.
#
# Runs tests only. Deliberately references NO secrets, so runs
# triggered by fork PRs are safe by construction; the signing
# and bundle-staging pipeline lives in ci-build.yml, which runs
# only on pushes to main.
###############################################################

name: PR build

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1

      - name: Run tests (JVM + Scala.js)
        run: sbt -batch +test
