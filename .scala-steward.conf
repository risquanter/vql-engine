# Stay on the sbt 1.x line. sbt 2.x is a major release whose new plugin
# architecture is not yet supported by the Scala.js plugins this build depends
# on (sbt-scalajs, sbt-scalajs-crossproject in project/plugins.sbt): under sbt
# 2.x their `%%%` cross-project DSL does not load, so build.sbt fails to
# evaluate. This pin keeps Scala Steward proposing 1.x bumps (1.13.x, 1.14.x, …)
# while suppressing the 2.x upgrade until those plugins ship sbt-2 support.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
